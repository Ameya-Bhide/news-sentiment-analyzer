name: Scrape Headlines

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"   # runs every 6 hours

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Pull Repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git pull
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scrapy vaderSentiment torch torchvision torchaudio transformers pandas matplotlib

      - name: Debug working directory
        run: |
          pwd
          ls -R

      - name: Run spider
        run: |
          cd news_sentiment
          scrapy crawl multinews

      # 🚀 Upload CSVs to Supabase
      - name: Upload headlines.csv to Supabase
        run: |
          curl -X POST "https://$SUPABASE_PROJECT.supabase.co/storage/v1/object/sentiment-data/headlines.csv" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: text/csv" \
            --data-binary @"news_sentiment/headlines.csv"

      - name: Upload daily_summary.csv to Supabase
        run: |
          curl -X POST "https://$SUPABASE_PROJECT.supabase.co/storage/v1/object/sentiment-data/daily_summary.csv" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: text/csv" \
            --data-binary @"news_sentiment/daily_summary.csv"

      - name: Upload market_sentiment_results.csv to Supabase
        run: |
          curl -X POST "https://$SUPABASE_PROJECT.supabase.co/storage/v1/object/sentiment-data/market_sentiment_results.csv" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: text/csv" \
            --data-binary @"news_sentiment/market_sentiment_results.csv"
