name: Scrape Headlines

on:
  workflow_dispatch:   # manual trigger
  schedule:
    - cron: "0 */6 * * *"   # runs every 6 hours

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      # --- Checkout repo ---
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Pull Repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git pull
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Python setup ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scrapy vaderSentiment torch torchvision torchaudio transformers pandas matplotlib yfinance scipy

      # --- Scrape headlines ---
      - name: Run spider
        run: |
          cd news_sentiment
          scrapy crawl multinews

      # --- Summarize sentiment ---
      - name: Generate daily_summary.csv
        run: |
          cd news_sentiment
          python summarize_sentiment.py

      # --- Analyze market ---
      - name: Generate market_sentiment_results.csv
        run: |
          cd news_sentiment
          python analyze_market.py

      # --- Upload CSVs to Supabase ---
      - name: Upload headlines.csv to Supabase
        run: |
          curl -X PUT "https://${{ secrets.SUPABASE_PROJECT }}.supabase.co/storage/v1/object/sentiment-data/headlines.csv" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Content-Type: text/csv" \
            --data-binary @"news_sentiment/headlines.csv"

      - name: Upload daily_summary.csv to Supabase
        run: |
          curl -X PUT "https://${{ secrets.SUPABASE_PROJECT }}.supabase.co/storage/v1/object/sentiment-data/daily_summary.csv" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Content-Type: text/csv" \
            --data-binary @"news_sentiment/daily_summary.csv"

      - name: Upload market_sentiment_results.csv to Supabase
        run: |
          curl -X PUT "https://${{ secrets.SUPABASE_PROJECT }}.supabase.co/storage/v1/object/sentiment-data/market_sentiment_results.csv" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Content-Type: text/csv" \
            --data-binary @"news_sentiment/market_sentiment_results.csv"
